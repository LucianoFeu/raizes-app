name: Deploy to Vercel

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        run: |
          npx vercel deploy --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --scope lucianofeu-6504s-projects
        env:
          VERCEL_ORG_ID: team_p4xf97nXsu3XPU3k52lO8hQ7
          VERCEL_PROJECT_ID: prj_Tjy4E3gT5wAw96C9jyGCQu6sYOLj
